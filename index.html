<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Test Vidéo Caméra</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 240px;
    height: 282px;
    background: #000;
    color: #fff;
    font-family: -apple-system, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    width: 240px;
    height: 282px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
  }
  #status {
    font-size: 9px;
    text-align: center;
    padding: 2px 4px;
    height: 20px;
    line-height: 10px;
    overflow: hidden;
    color: #ff5b00;
  }
  video, #playback {
    width: 240px;
    height: 172px;
    background: #111;
    object-fit: cover;
  }
  #controls {
    width: 240px;
    height: 90px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 4px;
  }
  button {
    background: #ff5b00;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 10px;
    font-weight: bold;
    padding: 7px 8px;
  }
  button:disabled {
    background: #555;
    color: #999;
  }
  #btnSwitch {
    background: #333;
    color: #ff5b00;
  }
  #rec-dot {
    display: none;
    position: absolute;
    top: 24px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: red;
  }
  a#dl {
    color: #ff5b00;
    font-size: 9px;
  }
  #linkRow {
    width: 240px;
    text-align: center;
    font-size: 8px;
    color: #7fdcff;
    word-break: break-all;
    padding: 0 4px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="status">Initialisation...</div>
  <div id="rec-dot"></div>
  <video id="preview" autoplay playsinline muted></video>
  <video id="playback" style="display:none" controls playsinline></video>
  <div id="controls">
    <button id="btnStart" disabled>● REC</button>
    <button id="btnStop" disabled>■ STOP</button>
    <button id="btnSwitch" disabled>↺ Caméra</button>
    <button id="btnLocal" style="display:none">🏠 PC local</button>
  </div>
  <div id="linkRow"></div>
  <input id="serverAddr" value="192.168.0.16:8765" style="display:none">
</div>

<script>
// --- SDK r1 : canaux JS documentés (creations-sdk) ---
// PluginMessageHandler : envoi de messages/logs vers l'hôte r1 (si présent)
function pluginLog(msg) {
  try {
    if (window.PluginMessageHandler && typeof window.PluginMessageHandler.postMessage === 'function') {
      window.PluginMessageHandler.postMessage(JSON.stringify({ message: msg }));
    }
  } catch (e) { /* pas d'hôte r1, on ignore */ }
}

// CreationStorageHandler : stockage persistant côté r1 (clé/valeur uniquement, pas de fichiers binaires)
function storageSet(key, value) {
  try {
    if (window.creationStorage && window.creationStorage.plain && typeof window.creationStorage.plain.setItem === 'function') {
      window.creationStorage.plain.setItem(key, btoa(value));
    } else if (window.CreationStorageHandler && typeof window.CreationStorageHandler.postMessage === 'function') {
      window.CreationStorageHandler.postMessage(JSON.stringify({ action: 'set', key, value }));
    }
  } catch (e) {}
}

const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
const playback = document.getElementById('playback');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const btnSwitch = document.getElementById('btnSwitch');
const btnLocal = document.getElementById('btnLocal');
const serverAddr = document.getElementById('serverAddr');
const recDot = document.getElementById('rec-dot');
const linkRow = document.getElementById('linkRow');

let mediaStream = null;
let mediaRecorder = null;
let chunks = [];
let lastBlob = null;
let videoInputs = [];
let currentDeviceIndex = 0;

function setStatus(txt) {
  statusEl.textContent = txt;
  pluginLog('[test-video] ' + txt);
}

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    videoInputs = devices.filter(d => d.kind === 'videoinput');
  } catch (e) {
    videoInputs = [];
  }
}

async function startStreamWithDevice(deviceId) {
  const constraints = deviceId
    ? { video: { deviceId: { exact: deviceId } }, audio: true }
    : { video: true, audio: true };
  return navigator.mediaDevices.getUserMedia(constraints);
}

async function initCamera() {
  setStatus('Demande accès caméra...');
  try {
    // premier accès pour obtenir la permission, ce qui débloque les labels dans enumerateDevices()
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    await listCameras();

    if (videoInputs.length > 1) {
      // essaie de retrouver le deviceId du flux courant pour partir du bon index
      const currentTrack = mediaStream.getVideoTracks()[0];
      const currentSettings = currentTrack && currentTrack.getSettings ? currentTrack.getSettings() : {};
      const idx = videoInputs.findIndex(d => d.deviceId === currentSettings.deviceId);
      currentDeviceIndex = idx >= 0 ? idx : 0;
      btnSwitch.disabled = false;
    }

    preview.srcObject = mediaStream;
    setStatus('Caméra OK (' + videoInputs.length + ' détectée(s)). Prêt.');
    btnStart.disabled = false;
  } catch (err) {
    setStatus('ÉCHEC getUserMedia: ' + (err && err.name ? err.name : err));
  }
}

async function switchCamera() {
  if (videoInputs.length < 2) return;
  btnSwitch.disabled = true;
  setStatus('Changement de caméra...');
  currentDeviceIndex = (currentDeviceIndex + 1) % videoInputs.length;
  const nextDevice = videoInputs[currentDeviceIndex];
  try {
    // coupe l'ancien flux avant d'en ouvrir un nouveau
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
    }
    mediaStream = await startStreamWithDevice(nextDevice.deviceId);
    preview.srcObject = mediaStream;
    setStatus('Caméra: ' + (nextDevice.label || ('caméra ' + (currentDeviceIndex + 1))));
  } catch (err) {
    setStatus('ÉCHEC changement caméra: ' + (err && err.name ? err.name : err));
  }
  btnSwitch.disabled = false;
}

function pickMimeType() {
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) {
      return c;
    }
  }
  return '';
}

function startRecording() {
  if (!mediaStream) return;
  chunks = [];
  linkRow.textContent = '';
  const mimeType = pickMimeType();
  try {
    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
  } catch (err) {
    setStatus('ÉCHEC MediaRecorder: ' + err.message);
    return;
  }
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.onerror = (e) => setStatus('Erreur recorder: ' + e.error);
  mediaRecorder.start();
  recDot.style.display = 'block';
  setStatus('Enregistrement... (' + (mimeType || 'défaut') + ')');
  btnStart.disabled = true;
  btnStop.disabled = false;
  btnSwitch.disabled = true;
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  recDot.style.display = 'none';
  btnStop.disabled = true;
}

function onRecordingStop() {
  const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
  const sizeKB = Math.round(blob.size / 1024);
  if (blob.size === 0) {
    setStatus('ÉCHEC: 0 octet enregistré.');
    btnStart.disabled = false;
    btnSwitch.disabled = videoInputs.length < 2;
    return;
  }
  lastBlob = blob;
  const url = URL.createObjectURL(blob);
  preview.style.display = 'none';
  playback.style.display = 'block';
  playback.src = url;

  setStatus('OK: ' + sizeKB + ' Ko capturés. Lecture ci-dessous.');
  storageSet('lastRecordingSizeKB', String(sizeKB));

  // Lien de téléchargement local direct (méthode de récupération n°1 : fiable, hors-ligne)
  const old = document.getElementById('dl');
  if (old) old.remove();
  const a = document.createElement('a');
  a.id = 'dl';
  a.href = url;
  a.download = 'r1-test-video.webm';
  a.textContent = 'Télécharger le fichier';
  a.style.position = 'absolute';
  a.style.bottom = '2px';
  a.style.left = '4px';
  document.getElementById('app').appendChild(a);

  // Méthode de récupération n°2 : envoi direct vers le PC local (serveur maison, aucun compte/clé)
  btnLocal.style.display = 'inline-block';
  btnLocal.disabled = false;

  btnStart.disabled = false;
  btnSwitch.disabled = videoInputs.length < 2;
}

async function uploadToLocalServer() {
  if (!lastBlob) return;
  btnLocal.disabled = true;
  linkRow.textContent = 'Envoi vers le PC local...';
  const addr = (serverAddr.value || '').trim();
  if (!addr) {
    linkRow.textContent = 'Adresse du PC local manquante.';
    btnLocal.disabled = false;
    return;
  }
  try {
    const resp = await fetch('http://' + addr + '/upload', {
      method: 'POST',
      headers: { 'Content-Type': lastBlob.type || 'video/webm' },
      body: lastBlob
    });
    const text = (await resp.text()).trim();
    if (resp.ok && text.startsWith('OK:')) {
      linkRow.textContent = 'Reçue sur le PC : ' + text.slice(3);
      setStatus('Vidéo envoyée au PC local.');
    } else {
      linkRow.textContent = 'Échec envoi PC local: ' + text;
      setStatus('ÉCHEC envoi PC local.');
    }
  } catch (err) {
    linkRow.textContent = 'Échec envoi PC local (réseau/serveur éteint): ' + (err && err.message ? err.message : err);
    setStatus('ÉCHEC envoi PC local.');
  }
  btnLocal.disabled = false;
}

btnStart.addEventListener('click', startRecording);
btnStop.addEventListener('click', stopRecording);
btnSwitch.addEventListener('click', switchCamera);
btnLocal.addEventListener('click', uploadToLocalServer);

// Bouton latéral (side button / PTT) du r1 : bascule start/stop en plus du bouton écran.
window.addEventListener('sideClick', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else if (!btnStart.disabled) {
    startRecording();
  }
});

window.addEventListener('load', initCamera);
</script>
</body>
</html>
